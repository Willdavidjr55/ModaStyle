<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Tu Carrito</h1>
    <nav>
        <a href="index.html">⬅ Volver a la tienda</a>
    </nav>
</header>

<section class="carrito">
    <h2>🛒 Productos</h2>
    <ul id="lista-carrito"></ul>
    <p class="total">Total: R$<span id="total">0</span></p>
<button class="btn-comprar" onclick="comunicarVendedor()">
    Comunicar al vendedor</button>

</section>

<ul id="lista-carrito"></ul>
<p class="total"><span id="total"></span></p>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let lista = document.getElementById("lista-carrito");
    let totalSpan = document.getElementById("total");
    let total = 0;

    if (carrito.length === 0) {
        lista.innerHTML = "<li>El carrito está vacío</li>";
        return;
    }

    carrito.forEach((producto, index) => {
        total += producto.precio;

        let li = document.createElement("li");
        li.classList.add("item-carrito");

        li.innerHTML = `
            <img src="${producto.imagen}" alt="${producto.nombre}">
            <div>
                <strong>${producto.nombre}</strong><br>
                $${producto.precio}
            </div>
            <button onclick="eliminar(${index})">❌</button>
        `;

        lista.appendChild(li);
    });

    totalSpan.textContent = total;

    window.eliminar = function(index) {
        carrito.splice(index, 1);
        localStorage.setItem("carrito", JSON.stringify(carrito));
        location.reload();
    };
});


let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
let lista = document.getElementById("lista-carrito");
let totalSpan = document.getElementById("total");
let total = 0;

function mostrarCarrito() {
    lista.innerHTML = "";
    total = 0;

    carrito.forEach((producto, index) => {
        total += producto.precio;

        let li = document.createElement("li");
        li.innerHTML = `
            ${producto.nombre} - $${producto.precio}
            <button onclick="eliminar(${index})">❌</button>
        `;
        lista.appendChild(li);
    });

    totalSpan.textContent = total;
}

function eliminar(index) {
    carrito.splice(index, 1);
    localStorage.setItem("carrito", JSON.stringify(carrito));
    mostrarCarrito();
}

mostrarCarrito();

function comunicarVendedor() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    if (carrito.length === 0) {
        alert("El carrito está vacío");
        return;
    }

    let mensaje = "Hola, quiero realizar el siguiente pedido:%0A%0A";
    let total = 0;

    carrito.forEach(producto => {
        mensaje += `- ${producto.nombre} (R$${producto.precio})%0A`;
        total += producto.precio;
    });

    mensaje += `%0ATotal: R$${total}`;

    // 🔴 CAMBIA ESTE NÚMERO
    let telefono = "+5546984006226"; // Ej: 549 + código país + número

    let url = `https://wa.me/${telefono}?text=${mensaje}`;
    window.open(url, "_blank");
}
</script>

</body>
</html>
